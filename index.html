<!DOCTYPE html>
<html>
<head>
  <title>Space Shooter PC + Mobile</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <style>
    body {
      margin: 0;
      background: black;
      overflow: hidden;
      touch-action: none;
    }
    canvas {
      display: block;
    }

    /* JOYSTICK */
    #joystick {
      position: fixed;
      bottom: 30px;
      left: 30px;
      width: 120px;
      height: 120px;
      border-radius: 50%;
      background: rgba(255,255,255,0.12);
    }
    #stick {
      position: absolute;
      left: 40px;
      top: 40px;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: rgba(255,255,255,0.6);
    }

    /* SHOOT */
    #shootBtn {
      position: fixed;
      bottom: 50px;
      right: 30px;
      width: 90px;
      height: 90px;
      border-radius: 50%;
      background: rgba(255,0,0,0.6);
      color: white;
      font-size: 24px;
      border: none;
    }
  </style>
</head>
<body>

<canvas id="game"></canvas>

<div id="joystick">
  <div id="stick"></div>
</div>

<button id="shootBtn">🔥</button>

<script src="game.js"></script>
</body>
</html>
